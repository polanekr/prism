[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "Radiochromic film dosimetry and beam analysis with a PyQt5 desktop interface"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib>=3.11.2,<4",
    "numpy>=2.5.4,<3",
    "PyQt5>=5.15.11,<5.16",
    "pyqtgraph>=0.14.0,<0.15",
    "scikit-image>=0.26.0,<0.27",
    "scikit-learn>=1.9.1,<2",
    "scipy>=1.18.1,<2",
    "tifffile>=2026.10.15",
    "tqdm>=4.70.1,<5",
]

[project.optional-dependencies]
bayes = [
    "pymc>=6.3.2,<7",
    "arviz>=1.3.0,<2",
    "h5netcdf>=1.8.1,<2",
    "h5py>=3.15,<4",
]
excel = ["openpyxl>=3.1.5,<4"]

[project.scripts]
prism = "prism_app:main"

[tool.setuptools]
py-modules = [
    "prism_app", "prism_gui", "dosimetry", "bio_dosimetry", "scan",
    "film_alignment", "sample_statistics", "scan_data", "uncertainty", "validation", "project_state",
    "benchmark", "processing_settings", "background_tasks", "bio_analysis",
    "calibration", "dose_solvers", "film_processing", "morphology", "bayes_support", "morphology_tab", "viewer_layout", "beam_analysis", "beam_analysis_panel",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
